# SQM valuation as of 16 October 2020, using only information available on that date.
# Historical inputs come from data/; everything below is an analyst assumption unless a
# source is given. Money in US$ millions, volumes in kt, prices in US$/t.

valuation_date: 2020-10-16
label: "October 2020 (with the information available then)"
first_year: 2020            # first projected year
horizon: 2060
balance_year: 2019          # latest audited balance sheet before the valuation date
cash_flows_from: 2020-01-01 # 2020 cash flows count in full: the bridge uses the Dec-2019 balance
bridge:
  other: -222.0             # dividends paid in 2020 (2020 cash flow statement), no longer in the company

shares: 263.196524          # million, SEC dei:EntityCommonStockSharesOutstanding
share_price: 27158          # CLP, SQM-B close 16-Oct-2020
currency_local: CLP
fx: 785.5                   # CLP per US$

inflation: 0.02
tax_rate: 0.27              # Chilean corporate rate
terminal_growth: 0.02
admin_pct_revenue: 0.060    # 2019 administrative expense / revenue
# working capital, 2016-2019 averages (calibrate.working_capital_ratios): 0.20 / 0.81 / 0.16
receivables_pct_revenue: 0.20   # trade receivables / revenue
inventory_pct_cost: 0.80        # inventories / cash cost of sales
payables_pct_cost: 0.17         # trade payables / cash cost of sales
depreciation_rate: 0.13     # 2019-2020 D&A / opening PP&E
opening_ppe: 1569.9         # PP&E Dec-2019
rim_omega: 0.6

weights: {dcf: 0.7, rim: 0.3}
rating_bands: {buy: 0.15, sell: -0.15}

discount:
  rf: 0.0123                # US Treasury 20y, 16-Oct-2020
  erp: 0.052                # Damodaran implied ERP, January 2020 update
  crp: 0.0084               # Chile 5y CDS 0.67% x 1.25 equity/bond volatility
  crp_exposure: 1.0
  beta_unlevered: {lithium: 1.20, chemicals: 0.85}   # assumption: lithium producers vs diversified chemicals
  debt_to_equity: 0.20      # SQM 2015-2019 average market D/E
  credit_spread: 0.020      # BBB+ US$ corporate spread

beta_groups: {lithium: lithium, potassium: chemicals, spn: chemicals, iodine: chemicals,
              industrial: chemicals, other: chemicals}

sensitivity_segment: lithium

segments:
  lithium:
    ppe_share: 0.22         # 2019 cost-of-sales share
    volume: {2020: 62, 2021: 90, 2022: 120, 2023: 140, 2024: 160, 2025: 180}
    price: {2020: 5900, 2021: 6500, 2022: 8000, 2023: 9500, 2024: 11000, 2025: 12000}
    price_growth: 0.02
    cash_cost_per_t: 3600   # ex lease and levies; 2019-2020 calibration gives US$3,300-3,700/t
    cost_base_year: 2020
    royalty: {brackets: corfo_lithium_carbonate, until: 2030}
    levies:
      - {pct_revenue: 0.017, until: 2030}          # regional development contribution (Corfo 2018)
      - {fixed: 27, until: 2030}                   # R&D (US$10.8-18.9m) + communities (US$10-15m)
    maintenance_capex_pct: 0.05
    capacity: {2020: 70, 2021: 120, 2023: 180}     # company-announced Chilean carbonate capacity plan
    expansion_cost_per_t: 6000                     # US$ per t of annual capacity
    regimes:
      - {to: 2030, type: corporate}                # Corfo lease runs to 31-Dec-2030
      - {from: 2031, to: 2060, type: margin_share, share: 0.35, probability: 0.5}  # renewal unknown in 2020
    terminal: none
  potassium:
    ppe_share: 0.13
    volume: {2020: 700}
    price: {2020: 290}
    cash_margin: 0.27       # 2016-2020 calibrated cash margin 0.25-0.30, lease included
    maintenance_capex_pct: 0.05
    regimes:
      - {to: 2030, type: corporate}
      - {from: 2031, to: 2060, type: margin_share, share: 0.35, probability: 0.5}
    terminal: none
  spn:
    ppe_share: 0.41
    volume: {2020: 1036}
    volume_growth: 0.02
    price: {2020: 680}
    cash_margin: 0.34       # 2016-2020 range 0.33-0.39
    maintenance_capex_pct: 0.05
  iodine:
    ppe_share: 0.17
    volume: {2020: 10.5, 2021: 12.5, 2022: 13.5, 2023: 14.5}
    volume_growth: 0.02
    price: {2020: 34000, 2021: 32000, 2022: 30000}
    cash_margin: 0.48       # 2016-2020 range 0.35-0.57
    maintenance_capex_pct: 0.06
  industrial:
    ppe_share: 0.045
    volume: {2020: 200}
    volume_growth: 0.02
    price: {2020: 750}
    cash_margin: 0.42
    maintenance_capex_pct: 0.05
  other:
    ppe_share: 0.025
    volume: {2020: 1}
    price: {2020: 30000}    # i.e. US$30m of revenue
    cash_margin: 0.10

montecarlo:
  segments: [lithium, iodine, spn, potassium]
  phi: 0.7
  seed: 7

scenarios:
  bear:
    _description: "Lithium settles at US$9,000/t and the concession is renewed only with 25% probability"
    segments:
      lithium:
        price: {2020: 5900, 2021: 6000, 2022: 6800, 2023: 7600, 2024: 8300, 2025: 9000}
        regimes:
          - {to: 2030, type: corporate}
          - {from: 2031, to: 2060, type: margin_share, share: 0.35, probability: 0.25}
  bull:
    _description: "Lithium reaches US$16,000/t and the concession is renewed with 75% probability"
    segments:
      lithium:
        price: {2020: 5900, 2021: 7500, 2022: 10000, 2023: 12500, 2024: 14500, 2025: 16000}
        regimes:
          - {to: 2030, type: corporate}
          - {from: 2031, to: 2060, type: margin_share, share: 0.35, probability: 0.75}
